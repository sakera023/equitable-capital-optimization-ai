[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "equitable-capital-optimization-ai"
version = "0.2.0"
description = "Research prototype for predictive and equitable capital-allocation analysis."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sakera Begum" }]
keywords = [
  "machine-learning",
  "entrepreneurship",
  "capital-allocation",
  "fairness",
  "explainable-ai",
  "streamlit"
]
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<4",
  "plotly>=5.20,<8",
  "scikit-learn>=1.4,<2",
  "streamlit>=1.40,<2"
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.8,<1"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["equitable_capital"]

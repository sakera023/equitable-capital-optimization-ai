name: Create v0.4.0 GitHub Release

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/release-v0.4.0"

permissions:
  contents: write
  actions: write

jobs:
  verify-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Verify version
        run: |
          python - <<'PY'
          import tomllib
          from pathlib import Path

          data = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          version = data["project"]["version"]
          if version != "0.4.0":
              raise SystemExit(f"Expected version 0.4.0, found {version}")
          print(f"Verified package version: {version}")
          PY

      - name: Lint
        run: ruff check src tests scripts app.py

      - name: Test
        run: python -m pytest -q

      - name: Build and validate distributions
        run: |
          python -m build
          python -m twine check dist/*

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.4.0 >/dev/null 2>&1; then
            echo "GitHub release v0.4.0 already exists."
          else
            gh release create v0.4.0               --target "${GITHUB_SHA}"               --title "v0.4.0 — Research & Adoption Release"               --notes-file RELEASE_NOTES.md
          fi

      - name: Dispatch trusted PyPI publishing workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --ref v0.4.0

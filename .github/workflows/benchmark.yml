name: Reproducible Model Benchmark

on:
  workflow_dispatch:
  push:
    paths:
      - "src/equitable_capital/benchmark.py"
      - "src/equitable_capital/data.py"
      - "src/equitable_capital/config.py"
      - "scripts/run_benchmarks.py"

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run benchmark
        run: python scripts/run_benchmarks.py

      - name: Upload benchmark outputs
        uses: actions/upload-artifact@v4
        with:
          name: model-benchmark-results
          path: |
            benchmarks/latest_runs.csv
            benchmarks/latest_summary.csv

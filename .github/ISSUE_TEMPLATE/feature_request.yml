name: Feature request
description: Propose an engineering or research improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Research or engineering problem
      description: What problem would this change solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
      description: Describe the implementation or methodological approach.
    validations:
      required: true
  - type: textarea
    id: tradeoffs
    attributes:
      label: Trade-offs / responsible-use considerations
      description: Note potential validity, fairness, privacy, or interpretation impacts.
